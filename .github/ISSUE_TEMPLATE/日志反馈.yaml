---
name: 📋 日志反馈（Bug 报告）
description: 反馈澜曜使用中遇到的问题，附带日志帮助修复
title: "[反馈] "
labels: ["bug", "日志反馈"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢反馈！为了帮你快速定位问题，请填写以下信息。
        **隐私提示**：日志已自动脱敏（不含密码/个人文件内容/私密区数据）。

  - type: input
    id: version
    attributes:
      label: 澜曜版本
      placeholder: "如 v1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: "如 Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 崩溃 / 闪退
        - 扫描异常
        - 播放问题
        - 分类错误
        - 界面问题
        - 更新失败
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 尽量详细描述发生了什么、怎么触发的
      placeholder: "我在做 XX 操作时，出现了 XX 问题..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志信息（脱敏后）
      description: 粘贴澜曜设置里的"反馈日志"自动生成的脱敏日志摘要
      placeholder: "【版本】v1.0.0\n【系统】Windows 11\n【日志】..."
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按什么顺序操作能复现这个问题
      placeholder: "1. 打开... 2. 点击... 3. ..."
    validations:
      required: false
